<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code Learning Guide</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2128;
    --border: #30363d;
    --accent: #d97757;
    --accent2: #a78bfa;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --text-muted: #6e7681;
    --green: #3fb950;
    --blue: #58a6ff;
    --yellow: #f0883e;
    --red: #f85149;
    --sidebar-w: 280px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; height: 100vh; overflow: hidden;
  }
  #sidebar {
    width: var(--sidebar-w); background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto;
  }
  #sidebar-header { padding: 20px 16px 14px; border-bottom: 1px solid var(--border); }
  #sidebar-header h1 { font-size: 15px; font-weight: 700; color: var(--accent); letter-spacing: .02em; }
  #sidebar-header p { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
  #progress-bar-wrap { background: var(--border); border-radius: 4px; height: 4px; margin-top: 10px; overflow: hidden; }
  #progress-bar { height: 100%; background: linear-gradient(90deg,var(--accent),var(--accent2)); border-radius: 4px; transition: width .4s ease; width: 0%; }
  #progress-label { font-size: 10px; color: var(--text-muted); margin-top: 4px; }
  #chapter-list { padding: 8px 0; flex: 1; }
  .chapter-group-title {
    font-size: 10px; font-weight: 700; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: .08em; padding: 8px 16px 4px;
  }
  .step-btn {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 8px 16px; background: none; border: none; text-align: left;
    cursor: pointer; color: var(--text-dim); font-size: 13px;
    transition: background .15s, color .15s;
  }
  .step-btn:hover { background: var(--surface2); color: var(--text); }
  .step-btn.active { background: var(--surface2); color: var(--text); border-right: 2px solid var(--accent); }
  .step-btn.done .step-num { background: var(--green); color: #000; }
  .step-btn.active .step-num { background: var(--accent); color: #fff; }
  .step-num {
    display: flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--border); color: var(--text-muted);
    font-size: 10px; font-weight: 700; flex-shrink: 0;
  }
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #topbar {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 12px 28px; display: flex; align-items: center;
    justify-content: space-between; flex-shrink: 0;
  }
  #topbar-title { font-size: 14px; font-weight: 600; color: var(--text-dim); }
  #topbar-actions { display: flex; gap: 8px; }
  .btn {
    padding: 7px 16px; border-radius: 6px; font-size: 13px; font-weight: 600;
    cursor: pointer; border: 1px solid var(--border); background: var(--surface2);
    color: var(--text); transition: all .15s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { background: #c96642; color: #fff; border-color: #c96642; }
  #content { flex: 1; overflow-y: auto; padding: 36px 48px; max-width: 820px; width: 100%; margin: 0 auto; }
  .step-header { margin-bottom: 28px; }
  .step-tag {
    display: inline-block; font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .1em;
    padding: 3px 8px; border-radius: 4px; background: var(--surface2);
    color: var(--accent); border: 1px solid var(--accent); margin-bottom: 10px;
  }
  .step-header h2 {
    font-size: 26px; font-weight: 700; line-height: 1.25; margin-bottom: 8px;
    background: linear-gradient(135deg, var(--text) 60%, var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .step-header .subtitle { color: var(--text-dim); font-size: 15px; line-height: 1.6; }
  h3 { font-size: 17px; font-weight: 700; margin: 24px 0 10px; color: var(--text); }
  h4 { font-size: 14px; font-weight: 700; margin: 18px 0 8px; color: var(--accent2); }
  p { font-size: 14px; line-height: 1.75; color: var(--text-dim); margin-bottom: 14px; }
  ul,ol { margin: 0 0 14px 20px; }
  li { font-size: 14px; line-height: 1.75; color: var(--text-dim); margin-bottom: 4px; }
  strong { color: var(--text); font-weight: 600; }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code {
    font-family: 'SF Mono','Fira Code','Cascadia Code',monospace; font-size: 12.5px;
    background: var(--surface2); border: 1px solid var(--border);
    padding: 2px 6px; border-radius: 4px; color: var(--accent);
  }
  pre {
    background: #0a0e13; border: 1px solid var(--border); border-radius: 8px;
    padding: 16px 18px; overflow-x: auto; margin: 14px 0; position: relative;
  }
  pre code { background: none; border: none; padding: 0; font-size: 13px; color: var(--text); line-height: 1.6; }
  .copy-btn {
    position: absolute; top: 8px; right: 8px; background: var(--surface2);
    border: 1px solid var(--border); color: var(--text-muted); font-size: 11px;
    padding: 3px 8px; border-radius: 4px; cursor: pointer; font-family: inherit; transition: all .15s;
  }
  .copy-btn:hover { color: var(--text); border-color: var(--accent); }
  .copy-btn.copied { color: var(--green); border-color: var(--green); }
  .callout { border-radius: 8px; padding: 14px 16px; margin: 18px 0; border-left: 3px solid; display: flex; gap: 10px; }
  .callout .icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
  .callout-body { flex: 1; }
  .callout-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
  .callout p { margin: 0; font-size: 13.5px; }
  .callout.tip { background: rgba(63,185,80,.08); border-color: var(--green); }
  .callout.tip .callout-title { color: var(--green); }
  .callout.info { background: rgba(88,166,255,.08); border-color: var(--blue); }
  .callout.info .callout-title { color: var(--blue); }
  .callout.warning { background: rgba(240,136,62,.08); border-color: var(--yellow); }
  .callout.warning .callout-title { color: var(--yellow); }
  .callout.community { background: rgba(167,139,250,.08); border-color: var(--accent2); }
  .callout.community .callout-title { color: var(--accent2); }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(210px,1fr)); gap: 12px; margin: 18px 0; }
  .card { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; transition: border-color .15s; }
  .card:hover { border-color: var(--accent); }
  .card-icon { font-size: 20px; margin-bottom: 8px; }
  .card-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .card-desc { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
  .terminal { background: #0a0e13; border: 1px solid var(--border); border-radius: 10px; margin: 18px 0; overflow: hidden; }
  .terminal-header { background: var(--surface2); padding: 8px 14px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.red { background: #ff5f57; } .dot.yellow { background: #febc2e; } .dot.green { background: #28c840; }
  .terminal-title { font-size: 12px; color: var(--text-muted); margin-left: 8px; }
  .terminal-body { padding: 16px 18px; font-family: 'SF Mono','Fira Code',monospace; font-size: 13px; line-height: 1.7; }
  .t-prompt { color: var(--green); }
  .t-cmd { color: var(--text); }
  .t-out { color: var(--text-muted); }
  .t-cmt { color: #555; font-style: italic; }
  .t-acc { color: var(--accent); }
  .t-blue { color: var(--blue); }
  #step-nav {
    padding: 16px 28px; border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    background: var(--surface); flex-shrink: 0;
  }
  #step-counter { font-size: 12px; color: var(--text-muted); }
  .quiz-q { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 12px; }
  .quiz-options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .quiz-opt {
    padding: 10px 14px; border: 1px solid var(--border); border-radius: 6px;
    cursor: pointer; font-size: 13px; color: var(--text-dim);
    background: var(--surface2); transition: all .15s; text-align: left;
  }
  .quiz-opt:hover { border-color: var(--accent2); color: var(--text); }
  .quiz-opt.correct { border-color: var(--green); background: rgba(63,185,80,.1); color: var(--green); }
  .quiz-opt.wrong { border-color: var(--red); background: rgba(248,81,73,.1); color: var(--red); }
  .quiz-result { font-size: 13px; font-weight: 600; padding: 8px 12px; border-radius: 6px; display: none; }
  .quiz-result.show { display: block; }
  .quiz-result.pass { background: rgba(63,185,80,.1); color: var(--green); }
  .quiz-result.fail { background: rgba(248,81,73,.1); color: var(--red); }
  .hero { text-align: center; padding: 20px 0 32px; }
  .hero-logo { font-size: 56px; margin-bottom: 16px; }
  .hero h2 { font-size: 32px; font-weight: 800; -webkit-text-fill-color: var(--text); background: none; margin-bottom: 12px; }
  .hero .subtitle { font-size: 16px; max-width: 540px; margin: 0 auto 24px; }
  .kw { color: #ff7b72; } .str { color: #a5d6ff; } .cmt { color: #8b949e; font-style: italic; }
  .fn { color: #d2a8ff; } .num { color: #f0883e; } .key { color: #79c0ff; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
</style>
</head>

<div class="step-header">
  <div class="step-tag">Context</div>
  <h2>CLAUDE.md &mdash; Your Project's Brain</h2>
  <p class="subtitle">CLAUDE.md is a markdown file Claude reads automatically. It gives Claude persistent

</div>
<h3>File Hierarchy</h3>
<pre><button class="copy-btn" onclick="copyCode(this)">Copy</button><code>~/
└── .claude/CLAUDE.md          <span class="cmt"># global user preferences</span>

my-project/
├── CLAUDE.md                  <span class="cmt"># project context (commit to git)</span>
├── src/
│   └── CLAUDE.md              <span class="cmt"># loaded when Claude is in src/</span>
└── ...</code></pre>
<div class="callout tip"><div class="icon">&#128161;</div><div class="callout-body">
  <div class="callout-title">Community tip</div>
  <p>Forum users consistently say CLAUDE.md is the single biggest productivity multiplier.
  A great CLAUDE.md means Claude never asks "what testing framework do you use?" again.</p>
</div></div>
<h3>Anatomy of a Great CLAUDE.md</h3>
<pre><button class="copy-btn" onclick="copyCode(this)">Copy</button><code><span class="cmt"># My SaaS Project</span>

<span class="cmt">## Stack</span>
Backend: Node.js/Express + PostgreSQL
Frontend: React + TypeScript
Deploy: AWS (ECS + RDS)

<span class="cmt">## Commands</span>
- Build:   npm run build
- Test:    npm test          (Jest + Supertest)
- Lint:    npm run lint      (ESLint + Prettier)
- Migrate: npm run migrate

<span class="cmt">## Code Conventions</span>
- async/await always — no raw callbacks
- Named exports only — no default exports
- All DB queries in /src/db/queries/
- Use our AppError class for all errors

<span class="cmt">## Off Limits</span>
- Never modify DB schema directly — use migrations
- Never change package versions without asking first</code></pre>

  <div class="step-tag">Commands</div>
  <h2>Slash Commands &mdash; Built-in &amp; Custom</h2>
  <p class="subtitle">Slash commands are reusable prompt templates. Built-ins handle common tasks;

<div class="card-grid">

  <div class="card"><div class="card-title"><code>/model</code></div><div class="card-desc">Switch AI model mid-session.</div></div>

</div>
<h3>Custom Commands &mdash; The Real Power</h3>
<p>Drop <code>.md</code> files in <code>.claude/commands/</code> and they become slash commands instantly.</p>
<pre><button class="copy-btn" onclick="copyCode(this)">Copy</button><code>my-project/
└── .claude/
    └── commands/
        ├── review-pr.md     <span class="cmt"># becomes /review-pr</span>
        ├── deploy.md        <span class="cmt"># becomes /deploy</span>
        └── fix-tests.md     <span class="cmt"># becomes /fix-tests</span></code></pre>
<h4>Example: /review-pr</h4>
<pre><button class="copy-btn" onclick="copyCode(this)">Copy</button><code><span class="cmt"># .claude/commands/review-pr.md</span>

Review the current git diff thoroughly. Check for:

1. Security vulnerabilities (SQL injection, XSS, auth bypasses)
2. Logic errors and edge cases not handled
3. Missing error handling or validation
4. Performance issues (N+1 queries, missing indexes)
5. Style violations per CLAUDE.md conventions

Format your output:

{
  group: "Power Features", title: "Hooks System", tag: "Automation",
  html: `
<div class="step-header">
  <div class="step-tag">Automation</div>
  <h2>Hooks &mdash; React to Claude's Actions</h2>
  <p class="subtitle">Hooks are shell commands that fire automatically when Claude does something.
  They're how you connect Claude's AI actions to your existing tools, guardrails, and workflows.</p>
</div>
<h3>Hook Event Types</h3>
<div class="card-grid">
  <div class="card"><div class="card-icon">&#128640;</div><div class="card-title">PreToolUse</div><div class="card-desc">Fires before Claude executes a tool. Can block or modify the action.</div></div>
  <div class="card"><div class="card-icon">&#9989;</div><div class="card-title">PostToolUse</div><div class="card-desc">Fires after a tool completes. React to what Claude just did.</div></div>
  <div class="card"><div class="card-icon">&#128276;</div><div class="card-title">Notification</div><div class="card-desc">Triggered when Claude sends a user-facing notification.</div></div>
  <div class="card"><div class="card-icon">&#128721;</div><div class="card-title">Stop</div><div class="card-desc">Fires when Claude finishes or stops responding.</div></div>
  <div class="card"><div class="card-icon">&#127758;</div><div class="card-title">SessionStart</div><div class="card-desc">Runs once at the beginning of every new session.</div></div>
  <div class="card"><div class="card-icon">&#129504;</div><div class="card-title">SubagentStop</div><div class="card-desc">Fires when a subagent completes in multi-agent workflows.</div></div>
</div>
<h3>Configuration (.claude/settings.json)</h3>
<pre><button class="copy-btn" onclick="copyCode(this)">Copy</button><code>{
  <span class="key">"hooks"</span>: {
    <span class="key">"PostToolUse"</span>: [
      {
        <span class="key">"matcher"</span>: <span class="str">"Write"</span>,
        <span class="key">"hooks"</span>: [{
          <span class="key">"type"</span>: <span class="str">"command"</span>,
          <span class="key">"command"</span>: <span class="str">"npx prettier --write \"$CLAUDE_TOOL_INPUT_PATH\""</span>
        }]
      }
    ],
    <span class="key">"Stop"</span>: [{
      <span class="key">"type"</span>: <span class="str">"command"</span>,
      <span class="key">"command"</span>: <span class="str">"osascript -e 'display notification \"Claude is done!\" with title \"Claude Code\"'"</span>
    }]
  }
}</code></pre>
<h3>Practical Hook Recipes</h3>
<h4>Auto-run tests after file edits</h4>
<pre><button class="copy-btn" onclick="copyCode(this)">Copy</button><code>{
  "matcher": "Write",
  "hooks": [{
    "type": "command",
    "command": "python3 -c \\"
import json, sys, subprocess
r = json.loads(sys.stdin.read())
path = r.get('path', '')
if path.endswith(('.ts', '.tsx', '.js')):
    result = subprocess.run(['npm', 'test', '--', '--testPathPattern', path],
                            capture_output=True, text=True)
    if result.returncode != 0:
        print(result.stdout[-2000:])  # feed test output back to Claude
\\""
  }]
}</code></pre>
<h4>Security guardrail: block destructive commands</h4>
<pre><button class="copy-btn" onclick="copyCode(this)">Copy</button><code><span class="cmt"># PreToolUse hook — runs before every Bash command</span>
{
  "matcher": "Bash",
  "hooks": [{
    "type": "command",
    "command": "python3 -c \\"
import json, sys
inp = json.loads(sys.stdin.read())
cmd = inp.get('command', '')
blocklist = ['rm -rf /', 'DROP TABLE', 'DELETE FROM users WHERE']
for danger in blocklist:
    if danger in cmd:
        # Exit code 2 = BLOCK the action, show reason to Claude
        print(json.dumps({'decision': 'block', 'reason': f'Blocked: {danger}'}))
        sys.exit(2)
\\""
  }]
}</code></pre>
<h4>Audit log every command</h4>
<pre><button class="copy-btn" onclick="copyCode(this)">Copy</button><code>{
  "matcher": "Bash",
  "hooks": [{
    "type": "command",
    "command": "echo \\"$(date -u +%Y-%m-%dT%H:%M:%SZ) $CLAUDE_TOOL_INPUT_COMMAND\\" >> ~/claude-audit.log"
  }]
}</code></pre>
<div class="callout community"><div class="icon">&#128172;</div><div class="callout-body">
  <div class="callout-title">From the forums: exit codes matter</div>
  <p><strong>Exit 0</strong> = proceed. <strong>Exit 2</strong> = block the action (Claude reads your stdout as the reason).
  <strong>Other non-zero</strong> = error logged but not blocking.
  This lets you build human-in-the-loop approval gates for sensitive operations.</p>
</div></div>
`},

  <div class="card"><div class="card-icon">&#128202;</div><div class="card-title">Alerts &#8594; Fix</div><div class="card-desc">PagerDuty alert fires, Claude reads the logs, opens a PR with a likely fix, pages the on-call engineer.</div></div>
  <div class="card"><div class="card-icon">&#128196;</div><div class="card-title">PR &#8594; Docs</div><div class="card-desc">Every merged PR triggers Claude to update the relevant README, API docs, and changelog.</div></div>
  <div class="card"><div class="card-icon">&#128640;</div><div class="card-title">Deploy &#8594; Test</div><div class="card-desc">Post-deploy hook runs Claude with the Playwright MCP to smoke-test key user flows in production.</div></div>
</div>
<h3>&#128161; Patterns That Surprised the Community</h3>
<ul>
  <li><strong>Database as context:</strong> Connecting the Postgres MCP lets Claude write better migrations because it can see your actual schema, not just what you describe.</li>
  <li><strong>Multiple personas:</strong> Running two Claude instances in one script &mdash; one as "developer", one as "code reviewer" &mdash; produces better quality than asking once.</li>
  <li><strong>Thinking out loud:</strong> Asking Claude to explain its plan before executing leads to far fewer mistakes on complex multi-file changes.</li>
  <li><strong>CLAUDE.md as a team contract:</strong> Teams commit CLAUDE.md to git so every developer gets consistent AI behavior, like a shared linter config but for AI.</li>

{
  group: "Best Practices", title: "Permissions &amp; Safety", tag: "Safety",
  html: `
<div class="step-header">
  <div class="step-tag">Safety</div>
  <h2>Permissions &amp; Safe Automation</h2>
  <p class="subtitle">Claude Code defaults to asking for permission on risky actions. Understanding
  how permissions work lets you lock things down or open things up exactly as needed.</p>
</div>
<h3>Permission Modes</h3>
<div class="card-grid">
  <div class="card"><div class="card-icon">&#128274;</div><div class="card-title">Default (Interactive)</div><div class="card-desc">Claude asks before running shell commands, creating files, or making git commits.</div></div>
  <div class="card"><div class="card-icon">&#9989;</div><div class="card-title">Auto-approve</div><div class="card-desc">Specific tools can be pre-approved in settings.json. Used for non-destructive ops.</div></div>
  <div class="card"><div class="card-icon">&#128421;</div><div class="card-title">Headless (CI/CD)</div><div class="card-desc">Use <code>--dangerouslySkipPermissions</code> only in isolated sandboxed environments.</div></div>
  <div class="card"><div class="card-icon">&#128268;</div><div class="card-title">Tool Allowlist</div><div class="card-desc"><code>--allowedTools Read,Write</code> restricts what Claude can do entirely.</div></div>
</div>
<h3>Granular Tool Permissions</h3>
<pre><button class="copy-btn" onclick="copyCode(this)">Copy</button><code><span class="cmt">// .claude/settings.json</span>
{
  <span class="key">"permissions"</span>: {
    <span class="key">"allow"</span>: [
      <span class="str">"Read"</span>,
      <span class="str">"Write"</span>,
      <span class="str">"Edit"</span>,
      <span class="str">"Bash(npm test)"</span>,        <span class="cmt">// only this exact command</span>
      <span class="str">"Bash(npm run lint)"</span>,
      <span class="str">"mcp__github__create_pr"</span>  <span class="cmt">// specific MCP tool</span>
    ],
    <span class="key">"deny"</span>: [
      <span class="str">"Bash(rm *)"</span>,
      <span class="str">"Bash(git push --force)"</span>,
      <span class="str">"mcp__filesystem__delete_file"</span>
    ]
  }
}</code></pre>
<h3>Safe Automation Checklist</h3>
<ul>
  <li>&#10003; Use <code>--allowedTools</code> to limit scope in automated scripts</li>
  <li>&#10003; Add a <code>PreToolUse</code> hook to log all Bash commands to an audit file</li>
  <li>&#10003; Never store API keys in CLAUDE.md — use environment variables</li>
  <li>&#10003; Run CI/CD agents in Docker containers with limited filesystem access</li>
  <li>&#10003; Use <code>--dry-run</code> or ask Claude to "plan but don't execute" before automating destructive ops</li>
  <li>&#10003; Review Claude's git diff before every merge — use hooks to enforce this</li>
</ul>
<div class="callout warning"><div class="icon">&#9888;&#65039;</div><div class="callout-body">
  <div class="callout-title">Production automation warning</div>
  <p>When running Claude in fully automated pipelines against production systems,
  always use the <strong>deny list</strong> in permissions, run in a container, and pipe
  Claude's action log somewhere you can audit. Claude is capable and powerful &mdash;
  scope it appropriately for the environment.</p>
</div></div>
`},

// ─────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────
let current = 0;
const visited = new Set();

function buildSidebar() {
  const list = document.getElementById('chapter-list');
  let lastGroup = '';
  STEPS.forEach((s, i) => {
    if (s.group !== lastGroup) {
      const div = document.createElement('div');
      div.className = 'chapter-group-title';
      div.textContent = s.group;
      list.appendChild(div);
      lastGroup = s.group;
    }
    const btn = document.createElement('button');
    btn.className = 'step-btn';
    btn.id = 'step-btn-' + i;
    btn.innerHTML = `<span class="step-num">${i + 1}</span><span style="font-size:12.5px">${s.title}</span>`;
    btn.onclick = () => goTo(i);
    list.appendChild(btn);
  });
}

function goTo(idx) {
  visited.add(current);
  current = idx;
  render();
}

function nextStep() {
  if (current < STEPS.length - 1) goTo(current + 1);
}

function prevStep() {
  if (current > 0) goTo(current - 1);
}

function render() {
  const step = STEPS[current];
  document.getElementById('content').innerHTML = step.html;
  document.getElementById('topbar-title').textContent = step.title.replace(/&amp;/g, '&');
  document.getElementById('step-counter').textContent = `Step ${current + 1} of ${STEPS.length}`;

  // Sidebar active state
  document.querySelectorAll('.step-btn').forEach((b, i) => {
    b.classList.toggle('active', i === current);
    b.classList.toggle('done', visited.has(i) && i !== current);
  });

  // Progress
  const pct = Math.round((visited.size / STEPS.length) * 100);
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `${visited.size} of ${STEPS.length} complete`;

  // Scroll content to top
  document.getElementById('content').scrollTop = 0;
}

function copyCode(btn) {
  const pre = btn.closest('pre');
  const code = pre.querySelector('code').innerText;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
  });
}

// ─────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────
buildSidebar();
render();
</script>
